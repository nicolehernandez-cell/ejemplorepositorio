<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
/*Movil First*/
/*Sin ningún media query */
        div{
            background: rgb(242, 5, 5);
            height: 100px;
        }
        /* Contenedor para pantallas con un ancho mínimo de 768px */
        /*tablets*/
        @media screen and (min-width: 768px) {
            div{
                background: green;
                height: 200px;
            }
        }
        /* Contenedor para pantallas con un ancho mínimo de 1200px */
        /*laptops*/
        @media screen and (min-width: 1200px) {
            div{
                background: blue;
                height: 100dvh;
            }
        }
        /*Grandes formatos*/
        @media screen and (min-width: 2400px) {
            div{
                background: purple;
                height: 100dvh;
            }
        }






        @media print {
            body{
                width: 23cm;
                height: 30cm;
            }
            div{
                width: 100%;
                height: 3cm;
                background-color: #ccc;
            }
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
